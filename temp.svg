<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  
  <!-- 定义样式和渐变 -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="snapshotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="memoryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#headerGradient)" rx="5" ry="5"/>
  <text x="600" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    SkillAgent 系统架构图 (MVP → 协作 → 回放)
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="16">
    展示 TaskSnapshot 如何实现「执行快照」抽象
  </text>
  
  <!-- SkillAgent 主容器 -->
  <rect x="100" y="120" width="1000" height="600" rx="10" ry="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" filter="url(#dropShadow)"/>
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">
    SkillAgent: {self.agent_id} - {self.skill_name}
  </text>
  
  <!-- 左侧：输入与状态区域 -->
  <rect x="150" y="160" width="300" height="500" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">
    输入 & 状态管理
  </text>
  
  <!-- RuntimeState -->
  <rect x="180" y="210" width="240" height="180" rx="6" ry="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">
    RuntimeState
  </text>
  
  <!-- RuntimeState 属性 -->
  <g font-family="Monaco, Consolas, monospace" font-size="12" fill="#374151">
    <text x="190" y="260">state: AgentState = IDLE</text>
    <text x="190" y="280">current_task: Optional[str] = None</text>
    <rect x="185" y="295" width="230" height="25" rx="3" ry="3" fill="url(#snapshotGradient)" opacity="0.9"/>
    <text x="190" y="312" fill="white">task_snapshot: Optional[TaskSnapshot]</text>
    <text x="190" y="335">current_step: Optional[str] = None</text>
    <text x="190" y="355">step_progress: float = 0.0</text>
    <text x="190" y="375">error: Optional[str] = None</text>
  </g>
  
  <!-- TaskSnapshot 详细结构 -->
  <rect x="180" y="410" width="240" height="220" rx="6" ry="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#065f46">
    TaskSnapshot (核心新增)
  </text>
  
  <!-- TaskSnapshot 属性 -->
  <g font-family="Monaco, Consolas, monospace" font-size="12" fill="#374151">
    <rect x="185" y="450" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="463">task_description: str</text>
    
    <rect x="185" y="470" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="483">skills_list: List[str]</text>
    
    <rect x="185" y="490" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="503">upstream_deliverables: Dict</text>
    
    <rect x="185" y="510" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="523">delivery_criteria: Dict</text>
    
    <rect x="185" y="530" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="543">task_context: Dict</text>
    
    <rect x="185" y="550" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="563">invocation_time: str</text>
    
    <rect x="185" y="570" width="230" height="18" rx="3" ry="3" fill="#10b981" opacity="0.2"/>
    <text x="190" y="583">(datetime.now().isoformat())</text>
  </g>
  
  <!-- 中间：执行流程区域 -->
  <rect x="500" y="160" width="200" height="500" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="600" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">
    执行流程
  </text>
  
  <!-- run() 方法 -->
  <rect x="520" y="210" width="160" height="80" rx="6" ry="6" fill="url(#agentGradient)"/>
  <text x="600" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    run() 方法
  </text>
  <text x="600" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    唯一对外执行入口
  </text>
  <g font-family="Monaco, Consolas, monospace" font-size="10" fill="white">
    <text x="530" y="275">run(task: str,</text>
    <text x="530" y="290">invocation_data: Dict) -> Any</text>
  </g>
  
  <!-- _enter_run() -->
  <rect x="520" y="310" width="160" height="60" rx="6" ry="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">
    _enter_run()
  </text>
  <text x="600" y="350" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="10" fill="#1e3a8a">
    创建 TaskSnapshot
  </text>
  
  <!-- _execute() -->
  <rect x="520" y="390" width="160" height="60" rx="6" ry="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">
    _execute()
  </text>
  <text x="600" y="430" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="10" fill="#1e3a8a">
    使用快照构建提示
  </text>
  
  <!-- _exit_run() -->
  <rect x="520" y="470" width="160" height="60" rx="6" ry="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">
    _exit_run()
  </text>
  <text x="600" y="510" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="10" fill="#1e3a8a">
    记录快照到 Memory
  </text>
  
  <!-- _build_prompt() -->
  <rect x="520" y="550" width="160" height="60" rx="6" ry="6" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9a3412">
    _build_prompt()
  </text>
  <text x="600" y="590" text-anchor="middle" font-family="Monaco, Consolas, monospace" font-size="10" fill="#9a3412">
    使用 snapshot 构建提示
  </text>
  
  <!-- 右侧：核心组件区域 -->
  <rect x="750" y="160" width="300" height="500" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="900" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">
    核心组件
  </text>
  
  <!-- BaseAgent -->
  <rect x="780" y="210" width="240" height="120" rx="6" ry="6" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="900" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">
    BaseAgent
  </text>
  <text x="900" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">
    推理引擎
  </text>
  
  <!-- BaseAgent 属性 -->
  <g font-family="Monaco, Consolas, monospace" font-size="11" fill="#374151">
    <text x="790" y="285">agent_id: "{self.agent_id}_base"</text>
    <text x="790" y="305">agent_type: "reasoning"</text>
    <text x="790" y="325">memory_size: 1000</text>
    <text x="790" y="345">run(prompt: str) -> Any</text>
  </g>
  
  <!-- Memory -->
  <rect x="780" y="350" width="240" height="180" rx="6" ry="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="900" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    SkillMemory
  </text>
  
  <!-- Memory 属性 -->
  <g font-family="Monaco, Consolas, monospace" font-size="11" fill="#374151">
    <text x="790" y="400">execution_history: List[Dict]</text>
    
    <rect x="785" y="415" width="230" height="60" rx="3" ry="3" fill="#f59e0b" opacity="0.2"/>
    <text x="790" y="430">记录完整执行上下文:</text>
    <text x="790" y="450">- task: str</text>
    <text x="790" y="465">- snapshot: Dict (asdict)</text>
    <text x="790" y="480">- success: bool</text>
    <text x="790" y="495">- result: Any</text>
    <text x="790" y="510">- error: Optional[str]</text>
    
    <text x="790" y="530">knowledge_base: Dict[str, Any]</text>
    <text x="790" y="550">checkpoints: Dict[str, Any]</text>
  </g>
  
  <!-- Workspace -->
  <rect x="780" y="550" width="240" height="80" rx="6" ry="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="900" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3730a3">
    Workspace
  </text>
  
  <g font-family="Monaco, Consolas, monospace" font-size="11" fill="#374151">
    <text x="790" y="600">{self.work_directory}/</text>
    <text x="790" y="615">├── logs/</text>
    <text x="790" y="630">├── data/</text>
    <text x="790" y="645">└── cache/</text>
  </g>
  
  <!-- 箭头：执行流程 -->
  <path d="M 300 290 L 520 250" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 290 L 600 310" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 370 L 600 390" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 450 L 600 470" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 箭头：TaskSnapshot 到 _execute -->
  <path d="M 300 450 L 520 420" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="410" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#065f46">
    snapshot = self.runtime.task_snapshot
  </text>
  
  <!-- 箭头：_execute 到 BaseAgent -->
  <path d="M 680 420 L 780 270" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="730" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
    prompt = self._build_prompt(task, snapshot)
  </text>
  
  <!-- 箭头：_exit_run 到 Memory -->
  <path d="M 680 500 L 780 440" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="730" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    memory.record_execution({"snapshot": asdict(...)})
  </text>
  
  <!-- 箭头：BaseAgent 返回结果 -->
  <path d="M 900 330 L 900 370 Q 900 380 890 380 L 680 380" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="790" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
    response = self.base_agent.run(prompt)
  </text>
  
  <!-- 关键价值点说明 -->
  <rect x="100" y="700" width="1000" height="80" rx="8" ry="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="720" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    TaskSnapshot 带来的关键能力跃迁：
  </text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="120" y="745">✅ 从「能跑」→ 协作感知（skills_list, upstream_deliverables）</text>
    <text x="120" y="765">✅ 从「能协作」→ 可回放/可审计（完整执行快照）</text>
    <text x="620" y="745">✅ 对齐/QA/Memory 的天然输入（future: agent.self_review()）</text>
    <text x="620" y="765">✅ 任务图（DAG）支持，为 orchestrator 铺平道路</text>
  </g>
  
  <!-- 图例 -->
  <rect x="100" y="790" width="1000" height="5" fill="#d1d5db"/>
  
  <g font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
    <rect x="150" y="800" width="12" height="12" rx="2" ry="2" fill="#3b82f6"/>
    <text x="170" y="810">核心流程</text>
    
    <rect x="250" y="800" width="12" height="12" rx="2" ry="2" fill="#10b981"/>
    <text x="270" y="810">TaskSnapshot 数据流</text>
    
    <rect x="380" y="800" width="12" height="12" rx="2" ry="2" fill="#ef4444"/>
    <text x="400" y="810">BaseAgent 交互</text>
    
    <rect x="500" y="800" width="12" height="12" rx="2" ry="2" fill="#f59e0b"/>
    <text x="520" y="810">Memory 记录</text>
    
    <rect x="620" y="800" width="12" height="12" rx="2" ry="2" fill="#8b5cf6"/>
    <text x="640" y="810">Workspace 文件系统</text>
  </g>
  
</svg>